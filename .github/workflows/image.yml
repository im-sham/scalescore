name: Production Image

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: local/scalescore:${{ github.sha }}

jobs:
  image-artifact:
    name: Build, Smoke, SBOM, and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify production lock drift
        run: |
          python -m pip install --constraint constraints/linux-x86_64-python3.12-dev.txt pip-tools==7.6.0
          python scripts/compile_production_lock.py --check

      - name: Set immutable build metadata
        id: metadata
        run: echo "created=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build shared Linux x86_64 image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}

      - name: Verify image platform and non-root identity
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "${IMAGE_NAME}")" = "linux/amd64"
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE_NAME}")" = "10001:10001"

      - name: Smoke API startup and health
        run: |
          docker run --detach --name readiness-api-smoke \
            --publish 127.0.0.1:18080:8000 \
            --env AUTH_SKIP_AUTH=true \
            "${IMAGE_NAME}" api
          cleanup() {
            docker logs readiness-api-smoke || true
            docker rm --force readiness-api-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/health \
              | python -c 'import json,sys; payload=json.load(sys.stdin); assert payload["status"] == "healthy"'; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Smoke worker command path
        run: docker run --rm "${IMAGE_NAME}" worker --help

      - name: Capture final installed runtime inventory
        run: |
          mkdir -p artifacts
          docker run --rm --entrypoint python "${IMAGE_NAME}" \
            -m pip list --format=json > artifacts/runtime-inventory.json
          docker run --rm --entrypoint python "${IMAGE_NAME}" -m pip check
          docker run --rm --entrypoint python "${IMAGE_NAME}" --version \
            > artifacts/python-version.txt 2>&1

      - name: Generate CycloneDX SBOM from final image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_NAME }}
          format: cyclonedx-json
          output-file: artifacts/scalescore.cdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Verify installed runtime and SBOM parity
        run: >-
          python scripts/verify_runtime_sbom_parity.py
          artifacts/runtime-inventory.json
          artifacts/scalescore.cdx.json

      - name: Record immutable image and rollback archive digests
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker save --output artifacts/scalescore-image.tar "${IMAGE_NAME}"
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "${IMAGE_NAME}")
          ARCHIVE_SHA256=$(sha256sum artifacts/scalescore-image.tar | cut -d ' ' -f 1)
          export IMAGE_ID ARCHIVE_SHA256
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          for name in ("ARCHIVE_SHA256", "BUILD_DIGEST", "GITHUB_SHA", "IMAGE_ID", "IMAGE_NAME"):
              if not os.environ.get(name):
                  raise SystemExit(f"missing immutable artifact identity field: {name}")

          identity = {
              "archive_sha256": f"sha256:{os.environ['ARCHIVE_SHA256']}",
              "build_digest": os.environ["BUILD_DIGEST"],
              "git_sha": os.environ["GITHUB_SHA"],
              "image_id": os.environ["IMAGE_ID"],
              "image_name": os.environ["IMAGE_NAME"],
              "platform": "linux/amd64",
          }
          Path("artifacts/artifact-identity.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Scan final image with strict Grype gate
        id: grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: ${{ env.IMAGE_NAME }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: artifacts/grype.json
          grype-version: v0.97.1
          cache-db: false

      - name: Retain immutable rollback and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scalescore-linux-x86_64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
