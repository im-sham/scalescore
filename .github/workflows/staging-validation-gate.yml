name: Staging Validation Gate

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Number of async benchmark jobs to submit
        default: "5"
        required: false
      timeout_seconds:
        description: Benchmark timeout in seconds
        default: "1800"
        required: false
      baseline_p95_seconds:
        description: Optional p95 completion-latency baseline (seconds) for regression gate
        required: false
      max_p95_regression_percent:
        description: Allowed p95 latency regression over baseline (percent)
        default: "25"
        required: false
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: staging-validation-gate
  cancel-in-progress: false

jobs:
  release-gate:
    name: Async Load/Stress + Auth Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_URL: http://127.0.0.1:8000
      EXTERNAL_OIDC_BASE_URL: http://127.0.0.1:8001
      ENVIRONMENT: staging
      AUTH_SKIP_AUTH: "false"
      RATE_LIMIT_BACKEND: redis
      FEATURE_ENABLE_ASYNC_ASSESSMENTS: "true"
      ASYNC_ASSESSMENT_MODE: poll
      INPUT_JOBS: ${{ github.event.inputs.jobs }}
      INPUT_TIMEOUT_SECONDS: ${{ github.event.inputs.timeout_seconds }}
      INPUT_BASELINE_P95_SECONDS: ${{ github.event.inputs.baseline_p95_seconds || vars.ASYNC_BENCHMARK_P95_BASELINE_SECONDS }}
      INPUT_MAX_P95_REGRESSION_PERCENT: ${{ github.event.inputs.max_p95_regression_percent }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install constrained dependencies
        run: |
          python -m pip install --upgrade --constraint constraints/linux-x86_64-python3.12-dev.txt 'pip>=26.0.1'
          python -m pip install --constraint constraints/linux-x86_64-python3.12-dev.txt -e ".[dev]"
          python -m pip check

      - name: Prepare benchmark dataset and artifact directories
        run: |
          set -euo pipefail
          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          VALIDATION_ROOT="${RUNNER_TEMP}/staging-validation/${TIMESTAMP}"
          AUTH_KEY_DIR="${RUNNER_TEMP}/staging-auth/${TIMESTAMP}"
          DATASET_DIR="${VALIDATION_ROOT}/dataset"
          BENCHMARK_DIR="${VALIDATION_ROOT}/benchmark"
          GATE_DIR="${VALIDATION_ROOT}/gate"
          SMOKE_DIR="${VALIDATION_ROOT}/smoke"

          mkdir -p \
            "${VALIDATION_ROOT}" \
            "${AUTH_KEY_DIR}" \
            "${DATASET_DIR}" \
            "${BENCHMARK_DIR}" \
            "${GATE_DIR}" \
            "${SMOKE_DIR}"

          JOBS="${INPUT_JOBS:-5}"
          TIMEOUT_SECONDS="${INPUT_TIMEOUT_SECONDS:-1800}"
          MAX_P95_REGRESSION_PERCENT="${INPUT_MAX_P95_REGRESSION_PERCENT:-25}"
          P95_BASELINE_SECONDS="${INPUT_BASELINE_P95_SECONDS:-}"

          echo "VALIDATION_ROOT=${VALIDATION_ROOT}" >>"${GITHUB_ENV}"
          echo "AUTH_KEY_DIR=${AUTH_KEY_DIR}" >>"${GITHUB_ENV}"
          echo "DATASET_DIR=${DATASET_DIR}" >>"${GITHUB_ENV}"
          echo "BENCHMARK_DIR=${BENCHMARK_DIR}" >>"${GITHUB_ENV}"
          echo "GATE_DIR=${GATE_DIR}" >>"${GITHUB_ENV}"
          echo "SMOKE_DIR=${SMOKE_DIR}" >>"${GITHUB_ENV}"
          echo "BENCHMARK_JOBS=${JOBS}" >>"${GITHUB_ENV}"
          echo "BENCHMARK_TIMEOUT_SECONDS=${TIMEOUT_SECONDS}" >>"${GITHUB_ENV}"
          echo "MAX_P95_REGRESSION_PERCENT=${MAX_P95_REGRESSION_PERCENT}" >>"${GITHUB_ENV}"
          echo "P95_BASELINE_SECONDS=${P95_BASELINE_SECONDS}" >>"${GITHUB_ENV}"

          INTERNAL_JWT_PRIVATE_KEY_PATH="${AUTH_KEY_DIR}/internal_jwt_private.pem"
          INTERNAL_JWT_PUBLIC_KEY_PATH="${AUTH_KEY_DIR}/internal_jwt_public.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "${INTERNAL_JWT_PRIVATE_KEY_PATH}" >/dev/null 2>&1
          openssl pkey -in "${INTERNAL_JWT_PRIVATE_KEY_PATH}" \
            -pubout -out "${INTERNAL_JWT_PUBLIC_KEY_PATH}" >/dev/null 2>&1
          echo "AUTH_JWT_PRIVATE_KEY_PATH=${INTERNAL_JWT_PRIVATE_KEY_PATH}" >>"${GITHUB_ENV}"
          echo "AUTH_JWT_PUBLIC_KEY_PATH=${INTERNAL_JWT_PUBLIC_KEY_PATH}" >>"${GITHUB_ENV}"

          python scripts/generate_async_benchmark_dataset.py \
            --output-dir "${DATASET_DIR}" \
            --organizations 1 \
            --teams-per-org 300 \
            --systems-per-org 300 \
            --vendors-per-org 300 \
            --facilities-per-org 300 \
            --growth-signals-per-org 40 \
            --overwrite | tee "${VALIDATION_ROOT}/dataset_generation.log"

      - name: Start ephemeral TLS Redis
        run: |
          set -euo pipefail
          umask 077

          REDIS_IMAGE="redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99"
          REDIS_CONTAINER_NAME="staging-validation-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REDIS_TLS_DIR="${RUNNER_TEMP}/staging-redis/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REDIS_TLS_CA_CERT_PATH="${REDIS_TLS_DIR}/ca.crt"

          mkdir -p "${REDIS_TLS_DIR}"
          echo "REDIS_CONTAINER_NAME=${REDIS_CONTAINER_NAME}" >>"${GITHUB_ENV}"
          echo "REDIS_TLS_DIR=${REDIS_TLS_DIR}" >>"${GITHUB_ENV}"
          echo "REDIS_TLS_CA_CERT_PATH=${REDIS_TLS_CA_CERT_PATH}" >>"${GITHUB_ENV}"

          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout "${REDIS_TLS_DIR}/ca.key" \
            -out "${REDIS_TLS_CA_CERT_PATH}" \
            -subj "/CN=Readiness Staging Validation CI CA" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "${REDIS_TLS_DIR}/server.key" \
            -out "${REDIS_TLS_DIR}/server.csr" \
            -subj "/CN=localhost" >/dev/null 2>&1
          printf '%s\n' \
            'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            'extendedKeyUsage=serverAuth' \
            >"${REDIS_TLS_DIR}/server.ext"
          openssl x509 -req -sha256 -days 1 \
            -in "${REDIS_TLS_DIR}/server.csr" \
            -CA "${REDIS_TLS_CA_CERT_PATH}" \
            -CAkey "${REDIS_TLS_DIR}/ca.key" \
            -CAcreateserial \
            -out "${REDIS_TLS_DIR}/server.crt" \
            -extfile "${REDIS_TLS_DIR}/server.ext" >/dev/null 2>&1

          docker run --detach \
            --name "${REDIS_CONTAINER_NAME}" \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:6380:6379 \
            --volume "${REDIS_TLS_DIR}:/tls:ro" \
            "${REDIS_IMAGE}" \
            redis-server \
            --bind 0.0.0.0 \
            --protected-mode no \
            --port 0 \
            --tls-port 6379 \
            --tls-cert-file /tls/server.crt \
            --tls-key-file /tls/server.key \
            --tls-ca-cert-file /tls/ca.crt \
            --tls-auth-clients no \
            --save "" \
            --appendonly no

          REDIS_HEALTHY="false"
          for attempt in {1..30}; do
            if docker exec "${REDIS_CONTAINER_NAME}" \
              redis-cli --tls --cacert /tls/ca.crt -h localhost -p 6379 ping \
              | tr -d '\r' | tr -d '\n' | grep -qx PONG; then
              REDIS_HEALTHY="true"
              break
            fi
            sleep 1
          done
          if [[ "${REDIS_HEALTHY}" != "true" ]]; then
            docker logs "${REDIS_CONTAINER_NAME}" >"${VALIDATION_ROOT}/redis.log" 2>&1 || true
            echo "TLS Redis did not become healthy." >&2
            exit 1
          fi

          echo "RATE_LIMIT_URL=rediss://localhost:6380/0?ssl_ca_certs=${REDIS_TLS_CA_CERT_PATH}&ssl_cert_reqs=required" \
            >>"${GITHUB_ENV}"

      - name: Run internal JWT smoke and async benchmark gate
        run: |
          set -uo pipefail

          INTERNAL_JWT_SMOKE_STATUS="FAIL"
          BENCHMARK_STATUS="FAIL"
          RELEASE_GATE_STATUS="FAIL"

          PRIMARY_API_PID=""
          cleanup() {
            if [[ -n "${PRIMARY_API_PID}" ]] && kill -0 "${PRIMARY_API_PID}" 2>/dev/null; then
              kill "${PRIMARY_API_PID}" 2>/dev/null || true
              wait "${PRIMARY_API_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          STORAGE_ASSESSMENTS_DB_PATH="${RUNNER_TEMP}/assessments-8000.sqlite3" \
          STORAGE_AUTH_DB_PATH="${RUNNER_TEMP}/auth-8000.sqlite3" \
          uvicorn scalescore.api.main:app --host 127.0.0.1 --port 8000 \
            >"${VALIDATION_ROOT}/api-8000.log" 2>&1 &
          PRIMARY_API_PID=$!

          HEALTHY="false"
          for attempt in {1..60}; do
            if curl -fsS "${BASE_URL}/api/v1/health" >"${SMOKE_DIR}/health_primary.json"; then
              HEALTHY="true"
              break
            fi
            if ! kill -0 "${PRIMARY_API_PID}" 2>/dev/null; then
              echo "Primary API exited before becoming healthy; see api-8000.log." >&2
              break
            fi
            sleep 1
          done
          if [[ "${HEALTHY}" != "true" ]]; then
            echo "Primary API did not become healthy." >&2
          else
            if python scripts/run_auth_smoke.py \
              --mode internal-jwt \
              --base-url "${BASE_URL}" \
              --result-path "${SMOKE_DIR}/internal_jwt_smoke.json" \
              --token-output-path "${SMOKE_DIR}/internal_access_token.txt"
            then
              INTERNAL_JWT_SMOKE_STATUS="PASS"
            fi
          fi

          if [[ "${INTERNAL_JWT_SMOKE_STATUS}" == "PASS" ]]; then
            ACCESS_TOKEN="$(tr -d '\n' < "${SMOKE_DIR}/internal_access_token.txt")"
            if ACCESS_TOKEN="${ACCESS_TOKEN}" python scripts/run_async_assessment_benchmark.py \
              --base-url "${BASE_URL}" \
              --dataset-dir "${DATASET_DIR}" \
              --jobs "${BENCHMARK_JOBS}" \
              --poll-interval-seconds 0.5 \
              --timeout-seconds "${BENCHMARK_TIMEOUT_SECONDS}" \
              --output-dir "${BENCHMARK_DIR}" \
              >"${VALIDATION_ROOT}/benchmark.log" 2>&1
            then
              BENCHMARK_STATUS="PASS"
            fi
          fi

          if [[ -f "${BENCHMARK_DIR}/benchmark_results.json" ]]; then
            GATE_ARGS=(
              python scripts/evaluate_async_benchmark_gate.py
              --benchmark-results "${BENCHMARK_DIR}/benchmark_results.json"
              --dataset-summary "${DATASET_DIR}/dataset_summary.json"
              --output-dir "${GATE_DIR}"
              --min-total-entities 1000
              --max-p95-regression-percent "${MAX_P95_REGRESSION_PERCENT}"
            )
            if [[ -n "${P95_BASELINE_SECONDS}" ]]; then
              GATE_ARGS+=(--baseline-p95-seconds "${P95_BASELINE_SECONDS}")
            fi

            if "${GATE_ARGS[@]}" >"${VALIDATION_ROOT}/release_gate.log" 2>&1; then
              RELEASE_GATE_STATUS="PASS"
            fi
          fi

          echo "INTERNAL_JWT_SMOKE_STATUS=${INTERNAL_JWT_SMOKE_STATUS}" >>"${GITHUB_ENV}"
          echo "BENCHMARK_STATUS=${BENCHMARK_STATUS}" >>"${GITHUB_ENV}"
          echo "RELEASE_GATE_STATUS=${RELEASE_GATE_STATUS}" >>"${GITHUB_ENV}"

      - name: Run external OIDC smoke check
        run: |
          set -uo pipefail

          EXTERNAL_OIDC_SMOKE_STATUS="FAIL"
          SECONDARY_API_PID=""
          cleanup() {
            if [[ -n "${SECONDARY_API_PID}" ]] && kill -0 "${SECONDARY_API_PID}" 2>/dev/null; then
              kill "${SECONDARY_API_PID}" 2>/dev/null || true
              wait "${SECONDARY_API_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          EXTERNAL_OIDC_PRIVATE_KEY_PATH="${AUTH_KEY_DIR}/external_oidc_private.pem"
          EXTERNAL_OIDC_PUBLIC_KEY_PATH="${AUTH_KEY_DIR}/external_oidc_public.pem"

          if ! openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "${EXTERNAL_OIDC_PRIVATE_KEY_PATH}" >/dev/null 2>&1 \
            || ! openssl pkey -in "${EXTERNAL_OIDC_PRIVATE_KEY_PATH}" \
              -pubout -out "${EXTERNAL_OIDC_PUBLIC_KEY_PATH}" >/dev/null 2>&1; then
            echo "Failed to generate external OIDC key pair." >&2
          else
            STORAGE_ASSESSMENTS_DB_PATH="${RUNNER_TEMP}/assessments-8001.sqlite3" \
            STORAGE_AUTH_DB_PATH="${RUNNER_TEMP}/auth-8001.sqlite3" \
            INTEGRATION_EXTERNAL_OIDC_AUTH_ENABLED=true \
            INTEGRATION_EXTERNAL_OIDC_PROVIDER_NAME=auth0 \
            INTEGRATION_EXTERNAL_OIDC_JWT_PUBLIC_KEY_PATH="${EXTERNAL_OIDC_PUBLIC_KEY_PATH}" \
            INTEGRATION_EXTERNAL_OIDC_JWT_ISSUER="https://idp.example.com/" \
            INTEGRATION_EXTERNAL_OIDC_JWT_AUDIENCE="scalescore-api" \
            INTEGRATION_EXTERNAL_OIDC_TENANT_CLAIM="tid" \
            INTEGRATION_EXTERNAL_OIDC_EMAIL_CLAIM="email" \
            INTEGRATION_EXTERNAL_OIDC_ROLES_CLAIM="groups" \
            uvicorn scalescore.api.main:app --host 127.0.0.1 --port 8001 \
              >"${VALIDATION_ROOT}/api-8001.log" 2>&1 &
            SECONDARY_API_PID=$!

            OIDC_HEALTHY="false"
            for attempt in {1..60}; do
              if curl -fsS "${EXTERNAL_OIDC_BASE_URL}/api/v1/health" >"${SMOKE_DIR}/health_external_oidc.json"; then
                OIDC_HEALTHY="true"
                break
              fi
              if ! kill -0 "${SECONDARY_API_PID}" 2>/dev/null; then
                echo "External OIDC API exited before becoming healthy; see api-8001.log." >&2
                break
              fi
              sleep 1
            done

            if [[ "${OIDC_HEALTHY}" == "true" ]]; then
              if python scripts/run_auth_smoke.py \
                --mode external-oidc \
                --base-url "${EXTERNAL_OIDC_BASE_URL}" \
                --private-key-path "${EXTERNAL_OIDC_PRIVATE_KEY_PATH}" \
                --issuer "https://idp.example.com/" \
                --audience "scalescore-api" \
                --result-path "${SMOKE_DIR}/external_oidc_smoke.json"
              then
                EXTERNAL_OIDC_SMOKE_STATUS="PASS"
              fi
            fi
          fi

          echo "EXTERNAL_OIDC_SMOKE_STATUS=${EXTERNAL_OIDC_SMOKE_STATUS}" >>"${GITHUB_ENV}"

      - name: Publish release-gate summary
        run: |
          set -euo pipefail

          INTERNAL_JWT_SMOKE_STATUS="${INTERNAL_JWT_SMOKE_STATUS:-FAIL}"
          BENCHMARK_STATUS="${BENCHMARK_STATUS:-FAIL}"
          RELEASE_GATE_STATUS="${RELEASE_GATE_STATUS:-FAIL}"
          EXTERNAL_OIDC_SMOKE_STATUS="${EXTERNAL_OIDC_SMOKE_STATUS:-FAIL}"

          OVERALL_STATUS="PASS"
          for status in \
            "${INTERNAL_JWT_SMOKE_STATUS}" \
            "${BENCHMARK_STATUS}" \
            "${RELEASE_GATE_STATUS}" \
            "${EXTERNAL_OIDC_SMOKE_STATUS}"; do
            if [[ "${status}" != "PASS" ]]; then
              OVERALL_STATUS="FAIL"
              break
            fi
          done

          {
            echo "## Staging Validation Gate"
            echo ""
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Internal JWT smoke | ${INTERNAL_JWT_SMOKE_STATUS} |"
            echo "| Async benchmark execution | ${BENCHMARK_STATUS} |"
            echo "| Async release-gate criteria | ${RELEASE_GATE_STATUS} |"
            echo "| External OIDC smoke | ${EXTERNAL_OIDC_SMOKE_STATUS} |"
            echo ""
            echo "- Overall: **${OVERALL_STATUS}**"
            echo "- Benchmark jobs: ${BENCHMARK_JOBS}"
            echo "- Benchmark timeout (seconds): ${BENCHMARK_TIMEOUT_SECONDS}"
            echo "- p95 baseline seconds: ${P95_BASELINE_SECONDS:-<not provided>}"
            echo "- Allowed p95 regression percent: ${MAX_P95_REGRESSION_PERCENT}"
            echo ""
            if [[ -f "${GATE_DIR}/release_gate_summary.md" ]]; then
              echo "### Gate Details"
              cat "${GATE_DIR}/release_gate_summary.md"
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

          if [[ "${OVERALL_STATUS}" != "PASS" ]]; then
            exit 1
          fi

      - name: Clean up ephemeral staging services
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${REDIS_CONTAINER_NAME:-}" ]]; then
            docker rm --force "${REDIS_CONTAINER_NAME}" >/dev/null 2>&1 || true
          fi
          if [[ -n "${REDIS_TLS_DIR:-}" && "${REDIS_TLS_DIR}" == "${RUNNER_TEMP}/staging-redis/"* ]]; then
            rm -rf "${REDIS_TLS_DIR}" "${AUTH_KEY_DIR}"
          fi

      - name: Upload staging validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.VALIDATION_ROOT }}
          if-no-files-found: error
          retention-days: 14
