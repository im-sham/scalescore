name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Verify Linux x86_64 constraint target
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"

      - name: Install constrained dependencies
        run: |
          python -m pip install --constraint "constraints/linux-x86_64-python${{ matrix.python-version }}-dev.txt" -e ".[dev]"
          python -m pip check

      - name: Verify Linux x86_64 dependency constraint drift
        run: python scripts/compile_dependency_constraints.py --check

      - name: Run Ruff
        run: >-
          ruff check src tests scripts/run_tests.py
          scripts/compile_dependency_constraints.py
          scripts/compile_production_lock.py
          scripts/verify_runtime_sbom_parity.py
          scripts/check_mypy_baseline.py

      - name: Run mypy monotonic baseline gate
        env:
          TRUSTED_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_mypy_baseline.py --base-ref "$TRUSTED_BASE_REF"

      - name: Run pinned ControlRef V0.1 conformance and compatibility
        run: python scripts/run_tests.py -q tests/unit/test_control_ref_contract.py

      - name: Run pytest
        run: python scripts/run_tests.py -q --ignore=tests/integration/test_redis_rate_limit.py


  redis-rate-limit-integration:
    name: Redis Rate Limit Integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install constrained dependencies
        run: |
          python -m pip install --constraint constraints/linux-x86_64-python3.12-dev.txt -e ".[dev]"
          python -m pip check

      - name: Run real Redis rate-limit integration proof
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TEST_REDIS_RATE_LIMIT_URL: redis://127.0.0.1:6379/15
        run: python scripts/run_tests.py -q tests/integration/test_redis_rate_limit.py

  redis-rate-limit-integration-python311:
    name: Redis Rate Limit Integration (Python 3.11)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install constrained dependencies
        run: |
          python -m pip install --constraint constraints/linux-x86_64-python3.11-dev.txt -e ".[dev]"
          python -m pip check

      - name: Run real Redis rate-limit integration proof
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          TEST_REDIS_RATE_LIMIT_URL: redis://127.0.0.1:6379/15
        run: python scripts/run_tests.py -q tests/integration/test_redis_rate_limit.py

  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install constrained audit dependencies
        run: |
          python -m pip install --constraint constraints/linux-x86_64-python3.12-dev.txt -e ".[dev]"
          python -m pip check

      - name: Run pip-audit against exact constraint sets
        run: |
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/darwin-arm64-python3.11-runtime.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/darwin-arm64-python3.11-dev.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/darwin-arm64-python3.11-frontend.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/darwin-arm64-python3.12-runtime.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/darwin-arm64-python3.12-dev.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/darwin-arm64-python3.12-frontend.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/linux-x86_64-python3.11-runtime.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/linux-x86_64-python3.11-dev.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/linux-x86_64-python3.11-frontend.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/linux-x86_64-python3.12-runtime.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/linux-x86_64-python3.12-dev.txt
          python -m pip_audit --progress-spinner off --strict --no-deps --disable-pip --requirement constraints/linux-x86_64-python3.12-frontend.txt
